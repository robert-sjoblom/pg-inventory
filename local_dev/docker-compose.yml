# pg-inventory local development environment
#
# Architecture:
#   - catalog: TimescaleDB (where collector writes)
#   - pg-primary: PostgreSQL primary (extractor connects here)
#   - pg-replica1, pg-replica2: Streaming replicas
#   - minio: S3-compatible storage for pgBackRest
#
# Usage:
#   1. Generate certs first: ./scripts/generate-certs.sh
#   2. Start: docker compose up -d
#   3. Connect to primary: psql "host=localhost port=5433 ..."

services:
  # TODO: enable this, but later -- it's noisy atm.
  # catalog:
  #   image: timescale/timescaledb:latest-pg15
  #   container_name: pg-inventory-catalog
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: catalog
  #   volumes:
  #     - catalog-data:/var/lib/postgresql/data
  #     - ./catalog/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  pg-primary:
    image: postgres:15-bullseye
    container_name: pg-inventory-primary
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - primary-data:/var/lib/postgresql/data
      - primary-pgbackrest-repo:/var/lib/pgbackrest
      # Config files
      - ./target/primary/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./target/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./target/primary/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      # TLS certificates (mounted to temp location, copied with correct ownership)
      - ./certs:/certs-source:ro
      # Init scripts (run in alphabetical order)
      - ./target/primary/sql:/docker-entrypoint-initdb.d:ro
    entrypoint: >
      /bin/bash -c "
      apt-get update -qq && apt-get install -y -qq pgbackrest && rm -rf /var/lib/apt/lists/* &&
      mkdir -p /var/lib/postgresql/certs &&
      cp /certs-source/* /var/lib/postgresql/certs/ &&
      chown postgres:postgres /var/lib/postgresql/certs/* &&
      chmod 600 /var/lib/postgresql/certs/*.key &&
      chmod 644 /var/lib/postgresql/certs/*.crt &&
      mkdir -p /var/log/pgbackrest /var/spool/pgbackrest /var/lib/pgbackrest &&
      chown -R postgres:postgres /var/log/pgbackrest /var/spool/pgbackrest /var/lib/pgbackrest &&
      exec docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -d postgres -tAc \"SELECT 1 FROM monitoring.cluster_config LIMIT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s


  pgbackrest-client:
    image: postgres:15-bullseye
    container_name: pg-inventory-pgbackrest-client
    depends_on:
      pg-primary:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
      apt-get update -qq && apt-get install -y -qq pgbackrest && rm -rf /var/lib/apt/lists/* &&
      exec tail -f /dev/null
      "
    volumes:
      - primary-pgbackrest-repo:/var/lib/pgbackrest
      - primary-data:/var/lib/postgresql/data:ro
      - ./target/primary/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    environment:
      PGBACKREST_STANZA: main
      PGBACKREST_LOG_LEVEL_CONSOLE: info
      PGHOST: pg-primary
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

  pg-replica1:
    image: postgres:15-bullseye
    container_name: pg-inventory-replica1
    ports:
      - "5434:5432"
    environment:
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - replica1-data:/var/lib/postgresql/data
      - ./certs:/certs-source:ro
    depends_on:
      pg-primary:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
      mkdir -p /var/lib/postgresql/certs &&
      cp /certs-source/* /var/lib/postgresql/certs/ &&
      chown postgres:postgres /var/lib/postgresql/certs/* &&
      chmod 600 /var/lib/postgresql/certs/*.key &&
      chmod 644 /var/lib/postgresql/certs/*.crt &&
      if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Initializing replica from primary...';
        until PGPASSWORD=replicator_password pg_basebackup -h pg-primary -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R -S replica1_slot; do
          echo 'Waiting for primary...';
          sleep 2;
        done;
        chown -R postgres:postgres /var/lib/postgresql/data;
      fi;
      exec docker-entrypoint.sh postgres;
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  pg-replica2:
    image: postgres:15-bullseye
    container_name: pg-inventory-replica2
    ports:
      - "5435:5432"
    environment:
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - replica2-data:/var/lib/postgresql/data
      - ./certs:/certs-source:ro
    depends_on:
      pg-primary:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
      mkdir -p /var/lib/postgresql/certs &&
      cp /certs-source/* /var/lib/postgresql/certs/ &&
      chown postgres:postgres /var/lib/postgresql/certs/* &&
      chmod 600 /var/lib/postgresql/certs/*.key &&
      chmod 644 /var/lib/postgresql/certs/*.crt &&
      if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Initializing replica from primary...';
        until PGPASSWORD=replicator_password pg_basebackup -h pg-primary -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R -S replica2_slot; do
          echo 'Waiting for primary...';
          sleep 2;
        done;
        chown -R postgres:postgres /var/lib/postgresql/data;
      fi;
      exec docker-entrypoint.sh postgres;
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  catalog-data:
  primary-data:
  primary-pgbackrest-repo:
  replica1-data:
  replica2-data:
