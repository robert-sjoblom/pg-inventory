name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: golangci/golangci-lint-action@v7
        with:
          version: "v2.7.2"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/pg-inventory-linux-amd64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o bin/pg-inventory-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o bin/pg-inventory-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o bin/pg-inventory-windows-amd64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/