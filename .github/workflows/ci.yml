name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: ./.github/actions/setup-protoc
      - uses: golangci/golangci-lint-action@v7
        with:
          version: "v2.7.2"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-protoc
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-protoc
      - name: Build all binaries
        run: |
          mkdir -p bin
          echo "Building extractor..."
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/extractor-linux-amd64 ./cmd/extractor
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o bin/extractor-darwin-amd64 ./cmd/extractor
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o bin/extractor-darwin-arm64 ./cmd/extractor
          
          echo "Building collector..."
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/collector-linux-amd64 ./cmd/collector
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o bin/collector-darwin-amd64 ./cmd/collector
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o bin/collector-darwin-arm64 ./cmd/collector
          
          echo "Building api-service..."
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/api-service-linux-amd64 ./cmd/api-service
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o bin/api-service-darwin-amd64 ./cmd/api-service
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o bin/api-service-darwin-arm64 ./cmd/api-service
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/