syntax = "proto3";
package extractor.v1;
option go_package = "github.com/robert-sjoblom/pg-inventory/gen/extractor/v1;extractorv1";

service ExtractorService {
    rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse);
    rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
    rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
    rpc ListSchemas(ListSchemasRequest) returns (ListSchemasResponse);
    rpc ListExtensions(ListExtensionsRequest) returns (ListExtensionsResponse);
    rpc ListSequences(ListSequencesRequest) returns (ListSequencesResponse);
    rpc ListFunctions(ListFunctionsRequest) returns (ListFunctionsResponse);
}

message ListDatabasesRequest {}
message ListDatabasesResponse {
    repeated Database databases = 1;
}

message ListBackupsRequest {}
message ListBackupsResponse {
    string stanza = 1;
    repeated BackupInfo backups = 2;
}

message GetServerInfoRequest {}
message GetServerInfoResponse {
    string cluster_name = 1;
    string pg_version = 2;
    bool is_in_recovery = 3;
    bool is_read_only = 4;
    bool ssl_enabled = 5;
    int32 port = 6;
    int32 max_connections = 7;
    string archive_mode = 8;
    string data_directory = 9;
    int64 system_identifier = 10;
    int32 timeline_id = 11;
    string wal_level = 12;
}

message ListSchemasRequest {}
message ListSchemasResponse {
    repeated Schema schemas = 1;
}

message ListExtensionsRequest {}
message ListExtensionsResponse {
    repeated InstalledExtension installed = 1;
    repeated AvailableExtension available = 2;
}

message ListSequencesRequest {}
message ListSequencesResponse {
    repeated Sequence sequences = 1;
}

message ListFunctionsRequest {}
message ListFunctionsResponse {
    repeated Function functions = 1;
}

message Function {
    uint32 oid = 1;
    string name = 2;
    string schema = 3;
    string owner = 4;
    string database = 5;
    string language = 6;
    string return_type = 7;
    string identity_arguments = 8;
}

message Sequence {
    uint32 oid = 1;
    string name = 2;
    string schema = 3;
    string owner = 4;
    string database = 5;
    string data_type = 6;
}

message InstalledExtension {
    uint32 oid = 1;
    string name = 2;
    string version = 3;
    string schema = 4;
    string database = 5;
}

message AvailableExtension {
    string name = 1;
    string default_version = 2;
}

message Schema {
    uint32 oid = 1;
    string name = 2;
    string owner = 3;
    string database = 4;
}


message Database {
    string name = 1;
    uint32 oid = 2;
}

message BackupInfo {
    string label = 1;
    string type = 2;
    int64 timestamp_start = 3;
    int64 timestamp_stop = 4;
    uint64 backup_size = 5;
    uint64 repo_size = 6;
    string database_version = 7;
    bool error = 8;
    uint32 repo_key = 9;
}