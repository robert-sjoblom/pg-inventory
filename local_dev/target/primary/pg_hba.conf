# pg_hba.conf for primary
# Controls who can connect and how they authenticate

# Local connections (inside container)
local   all             all                                     trust

# Replication connections from replicas (password auth)
hostssl replication     replicator      0.0.0.0/0               scram-sha-256

# pgmonitor must use client certificate
hostssl all             pgmonitor       0.0.0.0/0               cert

# Other users can use password over TLS
hostssl all             all             0.0.0.0/0               scram-sha-256
